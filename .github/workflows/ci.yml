name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  app:
    name: Bun app + frontend builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install PostgreSQL 18 and pgvector
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-18-pgvector
          sudo pg_ctlcluster 18 main start || sudo pg_ctlcluster 18 main status
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          create role utterlog_test with login password 'utterlog_test';
          create database utterlog_test owner utterlog_test;
          SQL
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d utterlog_test -c 'create extension vector'

      - name: Install Bun app deps
        run: bun install --frozen-lockfile

      - name: Type check application
        run: bun run check

      - name: Build application
        run: bun run build

      - name: Test Bun services and Start contracts
        env:
          UTTERLOG_INTEGRATION_DB: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: utterlog_test
          DB_USER: utterlog_test
          DB_PASSWORD: utterlog_test
          JWT_SECRET: test-secret-for-server-tests
        run: bun run test:server

      - name: Audit API coverage
        run: bun run audit:api

      - name: Sync theme styles
        working-directory: app/start
        run: bun run sync:themes
